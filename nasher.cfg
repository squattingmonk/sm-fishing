[package]
name = "SM Fishing"
description = "A configurable fishing system"
version = "0.1.0"
url = "https://github.com/squattingmonk/sm-fishing.git"
author = "Michael A. Sinclair <squattingmonk@gmail.com>"

  [package.sources]
  include = "src/*.{nss,json}"

  [package.rules]
  "*" = "src"

# The core system. Contains a default config script.
[target]
name = "erf"
file = "sm_fishing.erf"
description = "An erf containing the fishing scripts only"

# Demo modules share the module shell in src/demo (area, module.ifo, NPC,
# dialog, palettes, and helper scripts). Each one adds the files specific to it:
# the area instances (demo.git/gic), the custom item palette, its item
# blueprints, and (optionally) a preset config script that replaces the default
# src/fish_c_config.nss.
[target]
name = "demo"
file = "sm_fishing_demo.mod"
description = "A demo module showing the system in action"

  [target.sources]
  include = "src/*.{nss,json}"
  include = "src/demo/*.{nss,json}"
  include = "src/demo/default/*.{nss,json}"

  [target.rules]
  "fish_*.nss" = "src"
  "util_*.nss" = "src"
  "demo.gi[ct]" = "src/demo/default"
  "itempalcus.itp" = "src/demo/default"
  "*.uti" = "src/demo/default"
  "*" = "src/demo"

[target]
name = "minimal"
parent = "demo"
file = "sm_fishing_min.mod"
description = "A demo module using the minimal preset"

  [target.sources]
  include = "src/*.{nss,json}"
  include = "src/demo/*.{nss,json}"
  include = "src/demo/minimal/*.{nss,json}"
  include = "examples/minimal/*.{nss,json}"
  exclude = "src/fish_c_config.nss"

  [target.rules]
  "fish_c_config.nss" = "examples/minimal"
  "fish_*.nss" = "src"
  "util_*.nss" = "src"
  "demo.gi[ct]" = "src/demo/minimal"
  "itempalcus.itp" = "src/demo/minimal"
  "*.uti" = "examples/minimal"
  "*" = "src/demo"

# The importable minimal preset: config script plus the blueprints it uses.
[target]
name = "minimal-erf"
file = "sm_fishing_min.erf"
description = "An erf containing the minimal preset's config and blueprints"

  [target.sources]
  include = "examples/minimal/*.{nss,json}"
  include = "src/demo/fish_fishingspot.ut[tw].json"
  include = "src/demo/fish_t_pole.uti.json"
  # Config is an include script and needs fish_i_main to compile.
  skipCompile = "fish_c_config.nss"

  [target.rules]
  "fish_fishingspot.ut[tw]" = "src/demo"
  "fish_t_pole.uti" = "src/demo"
  "*" = "examples/minimal"
